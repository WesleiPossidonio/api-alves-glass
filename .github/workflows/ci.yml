name: Alves Glass CI

on:
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SECRET_KAY: ci-only-test-secret-not-for-production-0123456789abcdef
      GOOGLE_CLIENT_ID: 123456789012-ci-test.apps.googleusercontent.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test