services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: api-alves-glass

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - app-network

  postgres:
    image: postgres:17

    container_name: postgres-alves-glass

    restart: unless-stopped

    environment:
      POSTGRES_DB: alvesglass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alvesglass"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z

    container_name: minio-alves-glass

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  minio-client:
    image: minio/mc

    container_name: minio-client

    depends_on:
      minio:
        condition: service_healthy

    networks:
      - app-network

    entrypoint:
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin123;
      mc mb --ignore-existing local/uploads;
      mc anonymous set download local/uploads;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge