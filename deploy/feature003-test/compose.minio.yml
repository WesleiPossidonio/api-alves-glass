name: feature003-minio-isolated

services:
  minio:
    image: feature003-minio-community:RELEASE.2025-10-15T17-29-55Z-9e49d5e
    build:
      context: ../..
      dockerfile: deploy/feature003-test/Dockerfile.minio-community
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    container_name: feature003-minio-test
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${F003_IT_MINIO_ROOT_USER:?generate unique disposable MinIO test credentials}
      MINIO_ROOT_PASSWORD: ${F003_IT_MINIO_ROOT_PASSWORD:?generate unique disposable MinIO test credentials}
      MINIO_SITE_REGION: ${F003_IT_MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - feature003_minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - feature003_minio_test_network

volumes:
  feature003_minio_test_data:
    name: feature003_minio_test_data

networks:
  feature003_minio_test_network:
    name: feature003_minio_test_network